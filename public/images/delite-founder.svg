<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" role="img" aria-labelledby="title desc">
  <title id="title">Kreative Reflow founder portrait placeholder</title>
  <desc id="desc">A warm abstract editorial portrait placeholder for Delite, founder of Kreative Reflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f0efed"/>
      <stop offset="0.52" stop-color="#d8c5b6"/>
      <stop offset="1" stop-color="#151419"/>
    </linearGradient>
    <radialGradient id="glow" cx="58%" cy="34%" r="55%">
      <stop offset="0" stop-color="#fc6e20" stop-opacity="0.9"/>
      <stop offset="0.42" stop-color="#fc6e20" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fc6e20" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
